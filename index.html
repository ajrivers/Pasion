<script language="javascript">
	function sinSombra(id, name)
	{
		var c = document.getElementById(id);
		var s = new String(name);
		var p1 = s.substring(0, 12);
		var p2 = s.substring(12, 19);
		p1 = p1.concat('2');
		p1 = p1.concat(p2);
		c.src = p1;
	}
	
	function conSombra(id, name)
	{
		var c = document.getElementById(id);
		c.src = name;
	}
	
	function selectRandom()
	{
		var img = document.getElementById('rnd');
		var num = Math.random();
		num = Math.ceil(num * 10);
		if(num == 0)
			num++;
		var s = "Images/random/img";
		s = s.concat(num);
		s = s.concat('.jpg');
		img.src = s;
	}
</script>
